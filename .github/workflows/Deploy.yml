name: Deploy to thing
on:
  push:
    branches: [develop] # Or main, whichever your default is
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and Build
        run: |
          npm install
          npm run build
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # TurboWarp builds to the /dist folder
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
